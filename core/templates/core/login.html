{% extends 'core/base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Sign in to Brightloop</h1>
    <p class="text-sm text-slate-500 mb-6">Enter your registered email and password.</p>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if form.errors %}
            <div class="p-3 bg-red-50 text-red-700 text-xs rounded border border-red-200">
                Invalid email or password. Please try again.
            </div>
        {% endif %}
        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email Address</label>
            <input type="email" name="username" required autofocus class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
            <div class="relative">
                <input type="password" id="login-password" name="password" required class="w-full px-3 py-2 pr-10 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button type="button" onclick="togglePassword('login-password', this)" class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" tabindex="-1" aria-label="Toggle password visibility">
                    <svg class="h-4 w-4 eye-open" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <svg class="h-4 w-4 eye-closed hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                    </svg>
                </button>
            </div>
        </div>
        <div class="flex items-center justify-between text-xs">
            <a href="{% url 'password_reset' %}" class="text-indigo-600 hover:underline">Forgot password?</a>
            <a href="{% url 'signup' %}" class="text-slate-600 hover:underline">Create customer account &rarr;</a>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm">
            Sign In
        </button>
    </form>
</div>

<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const eyeOpen = btn.querySelector('.eye-open');
    const eyeClosed = btn.querySelector('.eye-closed');
    if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
    } else {
        input.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeClosed.classList.add('hidden');
    }
}
</script>
{% endblock %}
