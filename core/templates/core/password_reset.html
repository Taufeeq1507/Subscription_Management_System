{% extends 'core/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl border border-slate-200">
    <h2 class="text-xl font-bold mb-2">Reset Password</h2>
    <p class="text-xs text-slate-500 mb-4">Enter your registered email to receive a reset link.</p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold">Send Reset Link</button>
    </form>
</div>
{% endblock %}
