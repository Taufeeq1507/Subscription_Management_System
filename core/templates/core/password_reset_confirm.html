{% extends 'core/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl border border-slate-200">
    <h2 class="text-xl font-bold mb-4">Set New Password</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold">Update Password</button>
    </form>
</div>
{% endblock %}
